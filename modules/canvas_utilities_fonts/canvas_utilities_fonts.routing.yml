canvas_utilities_fonts.api.v1.collection:
  path: '/canvas-utilities/api/v1/fonts/{theme}'
  defaults:
    _controller: 'Drupal\canvas_utilities_fonts\Controller\Api\V1\FontController::collection'
  requirements:
    _permission: 'access canvas utilities'
    theme: '[a-z][a-z0-9_]*'
  methods: [GET]
  options:
    _format: 'json'

canvas_utilities_fonts.api.v1.remote:
  path: '/canvas-utilities/api/v1/fonts/{theme}/remote'
  defaults:
    _controller: 'Drupal\canvas_utilities_fonts\Controller\Api\V1\FontController::createRemote'
  requirements:
    _permission: 'administer canvas utilities fonts+use remote canvas utilities assets'
    _csrf_request_header_token: 'TRUE'
    theme: '[a-z][a-z0-9_]*'
  methods: [POST]
  options:
    _format: 'json'

canvas_utilities_fonts.api.v1.upload:
  path: '/canvas-utilities/api/v1/fonts/{theme}/upload'
  defaults:
    _controller: 'Drupal\canvas_utilities_fonts\Controller\Api\V1\FontController::upload'
  requirements:
    _permission: 'administer canvas utilities fonts'
    _csrf_request_header_token: 'TRUE'
    theme: '[a-z][a-z0-9_]*'
  methods: [POST]
  options:
    _format: 'json'

canvas_utilities_fonts.api.v1.update:
  path: '/canvas-utilities/api/v1/fonts/{theme}/{font}'
  defaults:
    _controller: 'Drupal\canvas_utilities_fonts\Controller\Api\V1\FontController::update'
  requirements:
    _permission: 'administer canvas utilities fonts'
    _csrf_request_header_token: 'TRUE'
    theme: '[a-z][a-z0-9_]*'
    font: '[a-z][a-z0-9_]*'
  methods: [PATCH]
  options:
    _format: 'json'

canvas_utilities_fonts.api.v1.delete:
  path: '/canvas-utilities/api/v1/fonts/{theme}/{font}'
  defaults:
    _controller: 'Drupal\canvas_utilities_fonts\Controller\Api\V1\FontController::delete'
  requirements:
    _permission: 'administer canvas utilities fonts'
    _csrf_request_header_token: 'TRUE'
    theme: '[a-z][a-z0-9_]*'
    font: '[a-z][a-z0-9_]*'
  methods: [DELETE]
  options:
    _format: 'json'

canvas_utilities_fonts.asset:
  path: '/canvas-utilities/assets/{theme}/fonts.css'
  defaults:
    _controller: 'Drupal\canvas_utilities_fonts\Controller\FontAssetController::__invoke'
  requirements:
    # Published local font declarations are public front-end assets.
    _access: 'TRUE'
    theme: '[a-z][a-z0-9_]*'
  methods: [GET]
