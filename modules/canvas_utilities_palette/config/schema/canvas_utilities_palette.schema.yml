canvas_utilities_palette.palette.*:
  type: config_entity
  label: 'Canvas Utilities palette'
  constraints:
    FullyValidatable: ~
  mapping:
    id:
      type: machine_name
      label: 'ID'
    label:
      type: required_label
      label: 'Label'
    uuid:
      type: uuid
      label: 'UUID'
    status:
      type: boolean
      label: 'Enabled'
    theme:
      type: machine_name
      label: 'Theme'
    description:
      type: text
      label: 'Description'
    prefix:
      type: machine_name
      label: 'CSS variable prefix'
    weight:
      type: integer
      label: 'Weight'
    colors:
      type: sequence
      label: 'Colors'
      sequence:
        type: mapping
        mapping:
          id:
            type: machine_name
            label: 'Color ID'
          label:
            type: required_label
            label: 'Color label'
          value:
            type: string
            label: 'Color value'
          role:
            type: string
            label: 'Semantic role'
          # Absent on entries stored before gradients were supported, which are
          # solid colors.
          # @see \Drupal\canvas_utilities_palette\Entity\Palette::getColors()
          type:
            requiredKey: false
            type: string
            label: 'Entry type'
            constraints:
              Choice:
                choices:
                  - color
                  - gradient
