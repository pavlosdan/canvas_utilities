canvas_utilities_palette.api.v1.collection:
  path: '/canvas-utilities/api/v1/palettes/{theme}'
  defaults:
    _controller: 'Drupal\canvas_utilities_palette\Controller\Api\V1\PaletteController::collection'
  requirements:
    _permission: 'access canvas utilities'
    theme: '[a-z][a-z0-9_]*'
  methods: [GET]
  options:
    _format: 'json'

canvas_utilities_palette.api.v1.create:
  path: '/canvas-utilities/api/v1/palettes/{theme}'
  defaults:
    _controller: 'Drupal\canvas_utilities_palette\Controller\Api\V1\PaletteController::create'
  requirements:
    _permission: 'administer canvas utilities palettes'
    _csrf_request_header_token: 'TRUE'
    theme: '[a-z][a-z0-9_]*'
  methods: [POST]
  options:
    _format: 'json'

canvas_utilities_palette.api.v1.delete:
  path: '/canvas-utilities/api/v1/palettes/{theme}/{palette}'
  defaults:
    _controller: 'Drupal\canvas_utilities_palette\Controller\Api\V1\PaletteController::delete'
  requirements:
    _permission: 'administer canvas utilities palettes'
    _csrf_request_header_token: 'TRUE'
    theme: '[a-z][a-z0-9_]*'
    palette: '[a-z][a-z0-9_]*'
  methods: [DELETE]
  options:
    _format: 'json'

canvas_utilities_palette.asset:
  path: '/canvas-utilities/assets/{theme}/palettes.css'
  defaults:
    _controller: 'Drupal\canvas_utilities_palette\Controller\PaletteAssetController::__invoke'
  requirements:
    # Published palette variables are public front-end assets.
    _access: 'TRUE'
    theme: '[a-z][a-z0-9_]*'
  methods: [GET]
