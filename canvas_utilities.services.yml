services:
  cache.canvas_utilities_generated_css:
    class: Drupal\Core\Cache\CacheBackendInterface
    factory: ['@cache_factory', get]
    arguments: [canvas_utilities_generated_css]
    tags:
      - { name: cache.bin }

  Drupal\canvas_utilities\GeneratedCss\GeneratedCssProviderRegistry:
    tags:
      - { name: service_collector, tag: canvas_utilities.generated_css_provider, call: addProvider }

  Drupal\canvas_utilities\GeneratedCss\GeneratedCssAssetManager:
    arguments:
      - '@cache.canvas_utilities_generated_css'
      - '@file_system'
      - '@lock'
      - '@logger.factory'

  Drupal\canvas_utilities\GeneratedCss\GeneratedCssInvalidator:
    arguments:
      - '@Drupal\canvas_utilities\GeneratedCss\GeneratedCssProviderRegistry'
      - '@cache_tags.invalidator'

  Drupal\canvas_utilities\PendingChanges\PendingChangesAdapterInterface:
    class: Drupal\canvas_utilities\PendingChanges\DirectPublishAdapter

  plugin.manager.canvas_utilities_capability:
    class: Drupal\canvas_utilities\Plugin\CanvasUtilitiesCapabilityManager
    parent: default_plugin_manager

  Drupal\canvas_utilities\Controller\Api\V1\BootstrapController:
    public: true
    arguments:
      - '@plugin.manager.canvas_utilities_capability'
      - '@config.factory'
      - '@extension.list.theme'
      - '@csrf_token'
      - '@current_user'
      - '@Drupal\canvas_utilities\PendingChanges\PendingChangesAdapterInterface'
